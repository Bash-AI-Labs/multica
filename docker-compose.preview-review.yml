# Vercel preview review overlay. Add it after the compose files you already run:
#
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.selfhost.build.yml \
#     -f docker-compose.preview-review.yml up -d
#
# With the Tailscale overlay, list this file last and set
# PREVIEW_REVIEW_MULTICA_API_URL=http://tailscale:4900 (the backend shares the
# tailscale container's network there).
#
# Setup, including the .env values below, is in
# examples/plugins/vercel-preview-review/README.md.

services:
  preview-review:
    build: ./examples/plugins/vercel-preview-review/server
    environment:
      VERCEL_TOKEN: ${VERCEL_TOKEN:?VERCEL_TOKEN must be set for the preview review service}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:?VERCEL_TEAM_ID must be set for the preview review service}
      # Both are shown once when an admin rotates the plugin's token. Until
      # they are set the service refuses the issue action (signing secret) and
      # does not send reviews on its own (plugin token).
      MULTICA_SIGNING_SECRET: ${PREVIEW_REVIEW_SIGNING_SECRET:-}
      MULTICA_PLUGIN_TOKEN: ${PREVIEW_REVIEW_PLUGIN_TOKEN:-}
      MULTICA_API_URL: ${PREVIEW_REVIEW_MULTICA_API_URL:-http://backend:8080}
      # A review goes out once a preview branch has had no new comment for
      # QUIET_SECONDS; Vercel is checked every POLL_SECONDS.
      QUIET_SECONDS: ${PREVIEW_REVIEW_QUIET_SECONDS:-120}
      POLL_SECONDS: ${PREVIEW_REVIEW_POLL_SECONDS:-30}
    volumes:
      - preview-review-tls:/tls
    networks:
      default:
        # net: scopes need a dotted host name.
        aliases: [preview-review.internal]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8787,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  backend:
    depends_on:
      # The backend reads MULTICA_PLUGIN_DEV_CA once at startup, so the
      # certificate has to exist first.
      preview-review:
        condition: service_healthy
    environment:
      FF_PLUGINS_V1: ${FF_PLUGINS_V1:-true}
      MULTICA_PLUGIN_DEV_ORIGINS: https://preview-review.internal:8787
      MULTICA_PLUGIN_DEV_CA: /preview-review-tls/cert.pem
    volumes:
      - preview-review-tls:/preview-review-tls:ro

volumes:
  preview-review-tls:
