# Per-IP rate limit zone for the public media path. Declared here at http
# scope (conf.d/*.conf is included inside the http{} block); applied via
# limit_req in the /uploads location below.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=30r/s;

server {
    listen 4901;

    # Allow per-workspace webhook paths (legacy)
    location ~ ^/[^/]+/webhooks/(linear|github)$ {
        proxy_pass http://127.0.0.1:4900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Allow GitHub App webhook endpoint
    location = /api/webhooks/github {
        proxy_pass http://127.0.0.1:4900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public, read-only access to uploaded media. Images attached to issues,
    # comments, and GitHub PRs are persisted with absolute /uploads/<key> URLs
    # on this funnel host (LOCAL_UPLOAD_BASE_URL). GitHub's camo image proxy
    # fetches them over the public funnel unauthenticated, so this path must be
    # reachable without a session.
    #
    # Lockdown (this path is public-internet facing):
    #   - Only image extensions are served; every other /uploads/* (PDFs, other
    #     attachments, the .meta.json sidecars) falls through to the 403 below.
    #   - X-Multica-Public marks the request as funnel traffic so the backend
    #     enforces a valid ?sig=<hmac> signature (unsigned/forged URLs -> 403).
    #     Trusted tailnet reads bypass this proxy and stay open.
    #   - Per-IP rate limiting blunts scraping/abuse.
    #   - GET/HEAD only; writes are rejected.
    location ~* ^/uploads/.+\.(png|jpe?g|gif|webp|bmp|ico|avif|svg)$ {
        limit_except GET HEAD {
            deny all;
        }
        limit_req zone=uploads burst=20 nodelay;
        proxy_pass http://127.0.0.1:4900;
        proxy_set_header X-Multica-Public 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block everything else
    location / {
        return 403 '{"error":"forbidden"}';
        add_header Content-Type application/json;
    }
}
