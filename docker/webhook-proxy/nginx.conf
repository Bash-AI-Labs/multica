server {
    listen 4901;

    # Allow per-workspace webhook paths (legacy)
    location ~ ^/[^/]+/webhooks/(linear|github)$ {
        proxy_pass http://127.0.0.1:4900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Allow GitHub App webhook endpoint
    location = /api/webhooks/github {
        proxy_pass http://127.0.0.1:4900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public, read-only access to uploaded media. Images attached to issues,
    # comments, and GitHub PRs are persisted with absolute /uploads/<key> URLs
    # on this funnel host (LOCAL_UPLOAD_BASE_URL). GitHub's camo image proxy
    # fetches them over the public funnel unauthenticated, so this path must be
    # reachable without a session. Keys are unguessable UUIDs; GET/HEAD only so
    # the funnel can't be used to mutate or enumerate storage.
    location /uploads/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:4900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block everything else
    location / {
        return 403 '{"error":"forbidden"}';
        add_header Content-Type application/json;
    }
}
